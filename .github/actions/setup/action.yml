name: Agent setup
description: Python, FFmpeg (libass) and Tamil fonts
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - uses: denoland/setup-deno@v2   # yt-dlp needs a JS runtime for YouTube downloads
      with:
        deno-version: v2.x
    - name: System packages
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-ui-core > /dev/null
        fc-list | grep -qi "Noto Sans Tamil" && echo "Tamil font OK"
    - name: Python packages
      shell: bash
      run: pip install -q -r requirements.txt
