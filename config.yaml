# ─────────────────────────────────────────────────────────────
#  GTA 6 Tamil — autonomous YouTube agent configuration
#  Everything here is editable without touching code.
# ─────────────────────────────────────────────────────────────

channel:
  name: "GTA 6 Tamil"              # shown as watermark + in descriptions
  handle: "@GTA6Tamil"             # your channel handle
  language: "ta"
  niche: "GTA 6 (Grand Theft Auto VI) news, guides, secrets and gameplay — explained in Tamil"
  persona: >
    Energetic Chennai/Madurai gamer anna who talks in natural spoken Tamil,
    mixing common English gaming words (mission, car, map, update, glitch)
    the way Tamil gaming YouTubers actually speak. Friendly, hype, never cringe.
  game_release_date: "2026-11-19"  # GTA 6 launch (PS5 / Xbox Series X|S)

# Free LLMs, tried in order. Missing keys are skipped automatically.
# Gemini = best Tamil quality. Groq / OpenRouter = open-weight models (Llama, gpt-oss, Qwen, DeepSeek).
llm:
  chain:
    - { provider: gemini,     model: "gemini-2.5-flash" }
    - { provider: gemini,     model: "gemini-2.0-flash" }
    - { provider: groq,       model: "openai/gpt-oss-120b" }
    - { provider: groq,       model: "llama-3.3-70b-versatile" }
    - { provider: openrouter, model: "deepseek/deepseek-chat-v3-0324:free" }
    - { provider: ollama,     model: "qwen2.5:7b" }       # only if you self-host
  temperature: 0.8
  max_retries_per_model: 2

# Content strategy — the strategist agent rotates through these pillars and
# re-weights them every day from real analytics.
pillars:
  news:        { weight: 3, desc: "Latest GTA 6 news, Rockstar announcements, updates, patches, GTA Online 6" }
  tips:        { weight: 3, desc: "Beginner tips, money making, best cars/weapons, hidden settings" }
  secrets:     { weight: 2, desc: "Easter eggs, secrets, hidden locations, glitches (no exploits that break ToS)" }
  story:       { weight: 2, desc: "Story/characters explained — Jason, Lucia, Leonida lore (spoiler warnings!)" }
  comparison:  { weight: 1, desc: "GTA 6 vs GTA 5 / Vice City comparisons, map size, physics, graphics" }
  reaction:    { weight: 1, desc: "Community reactions, Reddit theories, viral clips discussion" }

schedule:            # cron times live in .github/workflows/*.yml (UTC); this is the plan they implement
  long_per_day: 1    # 18:00 IST
  shorts_per_day: 2  # 11:00 IST and 21:00 IST
  breaking_news_shorts: true    # scout can fire an extra Short for big news
  max_breaking_per_day: 2

video:
  long:
    resolution: [1920, 1080]
    target_words: [900, 1300]     # ≈ 6–9 minutes of Tamil narration
  short:
    resolution: [1080, 1920]
    target_words: [95, 135]       # ≈ 40–55 seconds
  fps: 30
  crf: 23
  preset: "veryfast"
  music_volume: 0.10              # background music level (0–1); drop CC0 / YouTube Audio Library tracks in assets/music
  font: "Noto Sans Tamil"
  watermark: true

voice:
  engine_order: [edge, gtts]      # both free. edge = Microsoft neural voices, gtts = Google Translate TTS
  edge_voice: "ta-IN-ValluvarNeural"   # male. Female: ta-IN-PallaviNeural
  edge_rate: "+8%"
  edge_pitch: "+0Hz"

footage:
  github_release_tag: "footage"   # upload your own GTA 6 clips to this GitHub Release
  local_dir: "assets/footage"
  # Footage ingest from YouTube links (your OWN uploads only — ownership is checked via the API)
  allowed_channel_ids: []         # extra channels you own, e.g. a separate gameplay-dump channel "UCxxxx"
  clip_min_seconds: 6
  clip_max_seconds: 30
  max_clips_per_video: 40
  vision_tagging: true            # free Gemini vision tags each clip (car, chase, night, beach…)
  pexels_fallback: true           # free Miami/neon/car b-roll if PEXELS_API_KEY is set
  pexels_queries: ["miami night city", "neon city drive", "sports car night", "miami beach aerial", "police lights night", "palm trees sunset"]

trends:
  google_news_queries: ["GTA 6", "GTA VI", "Rockstar Games GTA", "GTA 6 Online"]
  reddit_subs: ["GTA6", "GTA", "rockstar"]
  youtube_competitor_query: "GTA 6 tamil"   # 100 quota units per run — used once a day by analyst
  breaking_threshold: 3           # same story in ≥N sources within 3h = breaking

publish:
  privacy: "public"               # forced to private by YouTube until your API project passes the audit
  category_id: "20"               # Gaming
  made_for_kids: false
  disclose_synthetic: true        # AI voice narration → declare altered/synthetic content
  playlists:
    news: "GTA 6 Tamil News"
    tips: "GTA 6 Tamil Tips & Guides"
    secrets: "GTA 6 Secrets in Tamil"
    story: "GTA 6 Story Explained Tamil"
    comparison: "GTA 6 Comparisons Tamil"
    reaction: "GTA 6 Tamil Reactions"
    shorts: "GTA 6 Tamil Shorts"

community:
  max_replies_per_run: 10
  max_replies_per_day: 60
  hold_spam: true
  harvest_requests: true          # viewer "next video on X" requests become topic ideas

marketing:
  self_comment: true              # posts an engagement question as a comment on each new video
  telegram: true                  # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
  discord: true                   # needs DISCORD_WEBHOOK_URL

quota:
  daily_units: 10000              # YouTube Data API default; uploads use their own bucket
  reserve_units: 1500             # never spend the last N units

safety:
  banned_phrases: ["free download", "apk", "crack", "torrent", "leak link", "mod menu", "money hack", "fitgirl", "pc download"]
